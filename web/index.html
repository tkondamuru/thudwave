<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project THUD-WAVE: Whiteboard Projector Canvas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        /* Top Navigation / Status Header */
        #hud {
            position: absolute;
            top: 15px;
            left: 20px;
            z-index: 10;
            color: #00ffcc;
            font-size: 14px;
            background: rgba(10, 10, 15, 0.85);
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid rgba(0, 255, 204, 0.3);
            display: flex;
            align-items: center;
            gap: 16px;
            backdrop-filter: blur(4px);
            transition: opacity 0.3s;
        }
        #hud.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #ff3366;
            display: inline-block;
            box-shadow: 0 0 8px #ff3366;
        }
        .status-dot.connected {
            background-color: #00ff88;
            box-shadow: 0 0 8px #00ff88;
        }
        .btn {
            background: #111;
            color: #00ffcc;
            border: 1px solid #00ffcc;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn:hover {
            background: #00ffcc;
            color: #000;
        }
        #tracker-pill {
            font-size: 12px;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #888;
            color: #aaa;
            transition: all 0.2s ease;
        }
        /* Instruction overlay for calibration */
        #calib-guide {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            color: #ffffff;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.85);
            padding: 10px 24px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        #calib-guide.hidden {
            opacity: 0;
        }
    </style>
</head>
<body>
    <div id="hud">
        <div><span id="conn-dot" class="status-dot"></span> <span id="conn-text">Connecting to Python...</span></div>
        <div id="hit-counter">Hits: 0</div>
        <button class="btn" id="calib-btn" onclick="toggleCalibration()">Mode: Adjust Pins [C]</button>
        <button class="btn" onclick="triggerTestHit()">Test Hit [T]</button>
        <button class="btn" onclick="resetCalibration()">Reset Pins</button>
        <div id="tracker-pill" style="display: none;"></div>
        <div style="color: #888; font-size: 11px;">[F11] Fullscreen | [C] Mode | Arrow keys nudge pin</div>
    </div>

    <div id="calib-guide">
        📍 <b>Pin Calibration Mode</b>: Drag 4 pins to align with physical whiteboard edges. Press <b>[C]</b> for Game Mode.
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const hud = document.getElementById('hud');
        const calibGuide = document.getElementById('calib-guide');
        const calibBtn = document.getElementById('calib-btn');
        const connDot = document.getElementById('conn-dot');
        const connText = document.getElementById('conn-text');
        const hitCounter = document.getElementById('hit-counter');
        const trackerPill = document.getElementById('tracker-pill');

        let totalHits = 0;
        let isCalibrationMode = true; // Start in calibration mode to let user verify/align pins
        let activeHandleIndex = -1;
        let hoveredHandleIndex = -1;
        let selectedHandleIndex = 0; // For arrow key nudging
        const HANDLE_RADIUS = 20;

        // 4 Calibration Corners in Normalized Screen Space (0.0 to 1.0)
        // Order: Top-Left (0), Top-Right (1), Bottom-Right (2), Bottom-Left (3)
        let corners = [
            { x: 0.15, y: 0.15 }, // TL
            { x: 0.85, y: 0.15 }, // TR
            { x: 0.85, y: 0.85 }, // BR
            { x: 0.15, y: 0.85 }  // BL
        ];

        let hasSavedCalibration = false;

        // 1. Immediately load saved calibration from localStorage
        const saved = localStorage.getItem('thudwave_corners');
        if (saved) {
            try {
                const parsed = JSON.parse(saved);
                if (Array.isArray(parsed) && parsed.length === 4) {
                    corners = parsed;
                    hasSavedCalibration = true;
                }
            } catch (e) {}
        }

        // 2. Fetch server-persisted calibration (projector_calibration.json)
        async function fetchServerCalibration() {
            try {
                const res = await fetch('/calibration');
                if (res.ok) {
                    const data = await res.json();
                    if (data && Array.isArray(data.corners) && data.corners.length === 4) {
                        corners = data.corners;
                        hasSavedCalibration = true;
                        localStorage.setItem('thudwave_corners', JSON.stringify(corners));
                        updateGuideText();
                    }
                }
            } catch (err) {}
        }
        fetchServerCalibration();

        // 3. Save calibration both to localStorage AND server
        function saveCalibration() {
            hasSavedCalibration = true;
            localStorage.setItem('thudwave_corners', JSON.stringify(corners));
            fetch('/calibration', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ corners: corners, timestamp: Date.now() })
            }).catch(() => {});
        }

        function updateGuideText() {
            if (isCalibrationMode) {
                if (hasSavedCalibration) {
                    calibGuide.innerHTML = `📍 <b>Previous Pins Restored</b>: Showing saved pin positions. Drag pins if projector moved, or press <b>[C]</b> for Game Mode.`;
                } else {
                    calibGuide.innerHTML = `🎯 <b>Pin Calibration Mode</b>: Drag 4 pins to align with whiteboard edges. Press <b>[C]</b> for Game Mode.`;
                }
            }
        }

        // Active shockwave ripple animations
        const ripples = [];

        // -------------------------------------------------------------
        // Web Audio API Synthesizer (Instant 0ms Audio)
        // -------------------------------------------------------------
        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        // Deep Sub-Bass BOOM! Sound
        function playBoomSound() {
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(160, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, ctx.currentTime + 0.35);

                gain.gain.setValueAtTime(1.0, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start();
                osc.stop(ctx.currentTime + 0.36);
            } catch (e) {}
        }

        // -------------------------------------------------------------
        // Canvas Resize & Coordinate Transformation
        // -------------------------------------------------------------
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Bilinear mapping from normalized whiteboard coords (nx, ny) [0..1]
        // to calibrated screen pixel coordinates (px, py)
        function mapWhiteboardToScreen(nx, ny) {
            const W = canvas.width;
            const H = canvas.height;
            const p0 = { x: corners[0].x * W, y: corners[0].y * H }; // TL
            const p1 = { x: corners[1].x * W, y: corners[1].y * H }; // TR
            const p2 = { x: corners[2].x * W, y: corners[2].y * H }; // BR
            const p3 = { x: corners[3].x * W, y: corners[3].y * H }; // BL

            const topX = p0.x + (p1.x - p0.x) * nx;
            const topY = p0.y + (p1.y - p0.y) * nx;

            const botX = p3.x + (p2.x - p3.x) * nx;
            const botY = p3.y + (p2.y - p3.y) * nx;

            return {
                x: topX + (botX - topX) * ny,
                y: topY + (botY - topY) * ny
            };
        }

        function mapScreenToWhiteboard(px, py) {
            const W = canvas.width;
            const H = canvas.height;
            const minX = Math.min(...corners.map(c => c.x * W));
            const maxX = Math.max(...corners.map(c => c.x * W));
            const minY = Math.min(...corners.map(c => c.y * H));
            const maxY = Math.max(...corners.map(c => c.y * H));
            const nx = Math.max(0, Math.min(1, (px - minX) / (maxX - minX)));
            const ny = Math.max(0, Math.min(1, (py - minY) / (maxY - minY)));
            return { nx, ny };
        }

        // -------------------------------------------------------------
        // Shockwave Impact Spawner (Ultra-Bright High-Lumen Kinetic Engine)
        // -------------------------------------------------------------
        const PALETTES = [
            { outer: '#00ffff', secondary: '#39ff14', core: '#ffffff' }, // Neon Cyan + Lime
            { outer: '#ff007f', secondary: '#00ffff', core: '#ffffff' }, // Electric Magenta + Cyan
            { outer: '#ffaa00', secondary: '#ff0055', core: '#ffffff' }, // Sunburst Amber + Fire
            { outer: '#00ffaa', secondary: '#00aaff', core: '#ffffff' }, // Mint Green + Azure
        ];

        function triggerImpact(nx, ny, label) {
            const screenPt = mapWhiteboardToScreen(nx, ny);
            totalHits++;
            hitCounter.innerText = `Hits: ${totalHits}`;

            playBoomSound();

            const palette = PALETTES[totalHits % PALETTES.length];

            // Radiating Kinetic Sparks
            const sparks = [];
            for (let i = 0; i < 18; i++) {
                const angle = (Math.PI * 2 / 18) * i + (Math.random() - 0.5) * 0.4;
                const speed = 6.0 + Math.random() * 9.0;
                sparks.push({
                    x: screenPt.x,
                    y: screenPt.y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1.0,
                    decay: 0.022 + Math.random() * 0.015,
                    color: palette.secondary
                });
            }

            ripples.push({
                x: screenPt.x,
                y: screenPt.y,
                radius: 12,
                palette: palette,
                label: label || `HIT #${totalHits}`,
                life: 1.0,
                flashRadius: 15,
                sparks: sparks
            });
        }

        function triggerTestHit() {
            const rx = 0.2 + Math.random() * 0.6;
            const ry = 0.2 + Math.random() * 0.6;
            triggerImpact(rx, ry, `TEST #${totalHits + 1}`);
        }

        // -------------------------------------------------------------
        // Mouse & Keyboard Controls
        // -------------------------------------------------------------
        canvas.addEventListener('mousedown', (e) => {
            getAudioContext();
            const mouseX = e.clientX;
            const mouseY = e.clientY;
            const W = canvas.width;
            const H = canvas.height;

            if (isCalibrationMode) {
                for (let i = 0; i < 4; i++) {
                    const cx = corners[i].x * W;
                    const cy = corners[i].y * H;
                    const dist = Math.hypot(mouseX - cx, mouseY - cy);
                    if (dist <= HANDLE_RADIUS + 14) {
                        activeHandleIndex = i;
                        selectedHandleIndex = i;
                        canvas.style.cursor = 'grabbing';
                        return;
                    }
                }
                return;
            }

            // In Game Mode: click triggers impact
            const norm = mapScreenToWhiteboard(mouseX, mouseY);
            triggerImpact(norm.nx, norm.ny, `CLICK #${totalHits + 1}`);
        });

        window.addEventListener('mousemove', (e) => {
            const W = canvas.width;
            const H = canvas.height;

            if (isCalibrationMode) {
                if (activeHandleIndex !== -1) {
                    corners[activeHandleIndex].x = Math.max(0.01, Math.min(0.99, e.clientX / W));
                    corners[activeHandleIndex].y = Math.max(0.01, Math.min(0.99, e.clientY / H));
                    saveCalibration();
                    canvas.style.cursor = 'grabbing';
                } else {
                    let hovering = -1;
                    for (let i = 0; i < 4; i++) {
                        const cx = corners[i].x * W;
                        const cy = corners[i].y * H;
                        if (Math.hypot(e.clientX - cx, e.clientY - cy) <= HANDLE_RADIUS + 14) {
                            hovering = i;
                            break;
                        }
                    }
                    hoveredHandleIndex = hovering;
                    canvas.style.cursor = (hovering !== -1) ? 'grab' : 'default';
                }
            } else {
                canvas.style.cursor = 'default';
            }
        });

        window.addEventListener('mouseup', () => {
            if (activeHandleIndex !== -1) {
                saveCalibration();
            }
            activeHandleIndex = -1;
            if (isCalibrationMode) {
                canvas.style.cursor = (hoveredHandleIndex !== -1) ? 'grab' : 'default';
            }
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'c' || e.key === 'C') {
                toggleCalibration();
            } else if (e.key === 't' || e.key === 'T') {
                triggerTestHit();
            } else if (e.key === 'h' || e.key === 'H') {
                hud.classList.toggle('hidden');
            } else if (isCalibrationMode && ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                e.preventDefault();
                const step = e.shiftKey ? 0.01 : 0.002;
                const pin = corners[selectedHandleIndex];
                if (e.key === 'ArrowUp') pin.y = Math.max(0.01, pin.y - step);
                if (e.key === 'ArrowDown') pin.y = Math.min(0.99, pin.y + step);
                if (e.key === 'ArrowLeft') pin.x = Math.max(0.01, pin.x - step);
                if (e.key === 'ArrowRight') pin.x = Math.min(0.99, pin.x + step);
                saveCalibration();
            } else if (isCalibrationMode && ['1', '2', '3', '4'].includes(e.key)) {
                selectedHandleIndex = parseInt(e.key) - 1;
            }
        });

        function toggleCalibration() {
            isCalibrationMode = !isCalibrationMode;
            if (isCalibrationMode) {
                calibBtn.innerText = "Mode: Adjust Pins [C]";
                calibBtn.style.borderColor = "#00ffcc";
                calibBtn.style.color = "#00ffcc";
                calibGuide.classList.remove('hidden');
                updateGuideText();
            } else {
                saveCalibration();
                calibBtn.innerText = "Mode: Active Game [C]";
                calibBtn.style.borderColor = "#ff3366";
                calibBtn.style.color = "#ff3366";
                calibGuide.classList.add('hidden');
            }
        }

        function resetCalibration() {
            corners = [
                { x: 0.15, y: 0.15 },
                { x: 0.85, y: 0.15 },
                { x: 0.85, y: 0.85 },
                { x: 0.15, y: 0.85 }
            ];
            hasSavedCalibration = false;
            saveCalibration();
            updateGuideText();
        }

        // -------------------------------------------------------------
        // Main Animation Loop (60 FPS Canvas Render)
        // -------------------------------------------------------------
        function render() {
            const W = canvas.width;
            const H = canvas.height;

            // 1. Pure Black Background (invisible on wall)
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, W, H);

            // 2. Draw Calibration Quad & Pins (Only in Calibration Mode)
            if (isCalibrationMode) {
                const pts = corners.map(c => ({ x: c.x * W, y: c.y * H }));

                // Glowing Quad Border
                ctx.save();
                ctx.strokeStyle = '#00ffcc';
                ctx.lineWidth = 2;
                ctx.shadowColor = '#00ffcc';
                ctx.shadowBlur = 12;
                ctx.beginPath();
                ctx.moveTo(pts[0].x, pts[0].y);
                ctx.lineTo(pts[1].x, pts[1].y);
                ctx.lineTo(pts[2].x, pts[2].y);
                ctx.lineTo(pts[3].x, pts[3].y);
                ctx.closePath();
                ctx.stroke();

                // Crosshair in Center
                const center = mapWhiteboardToScreen(0.5, 0.5);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(center.x - 20, center.y);
                ctx.lineTo(center.x + 20, center.y);
                ctx.moveTo(center.x, center.y - 20);
                ctx.lineTo(center.x, center.y + 20);
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(center.x, center.y, 10, 0, Math.PI * 2);
                ctx.stroke();

                // 4 Corner Draggable Pins
                for (let i = 0; i < 4; i++) {
                    const isSelected = (selectedHandleIndex === i);
                    const isActive = (activeHandleIndex === i);
                    const isHovered = (hoveredHandleIndex === i);

                    ctx.beginPath();
                    ctx.arc(pts[i].x, pts[i].y, HANDLE_RADIUS + (isActive ? 6 : isHovered ? 3 : 0), 0, Math.PI * 2);
                    ctx.strokeStyle = isActive ? '#ffffff' : (isSelected ? '#ffea00' : '#00ffcc');
                    ctx.lineWidth = isActive ? 3 : 2;
                    ctx.shadowColor = isActive ? '#ffffff' : (isSelected ? '#ffea00' : '#00ffcc');
                    ctx.shadowBlur = isActive ? 20 : 12;
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(pts[i].x, pts[i].y, HANDLE_RADIUS, 0, Math.PI * 2);
                    ctx.fillStyle = isActive ? '#ffffff' : (isHovered ? '#33ffdd' : '#00ccaa');
                    ctx.fill();

                    ctx.beginPath();
                    ctx.arc(pts[i].x, pts[i].y, 6, 0, Math.PI * 2);
                    ctx.fillStyle = '#000000';
                    ctx.fill();
                }
                ctx.restore();
            }

            // 3. Render Active Kinetic Shockwaves (Ultra-Bright Projector Optimized)
            for (let i = ripples.length - 1; i >= 0; i--) {
                const r = ripples[i];
                r.radius += 5.8;
                r.life -= 0.016; // Lasts ~60 frames (approx 1 second of vibrant, high-energy visuals)

                if (r.life <= 0) {
                    ripples.splice(i, 1);
                    continue;
                }

                ctx.save();

                // A. Explosive Center Flash Disc (illuminates the impact point)
                if (r.flashRadius < 90) {
                    r.flashRadius += 5.0;
                    const flashGrad = ctx.createRadialGradient(r.x, r.y, 0, r.x, r.y, r.flashRadius);
                    flashGrad.addColorStop(0, `rgba(255, 255, 255, ${Math.min(1.0, r.life * 1.3)})`);
                    flashGrad.addColorStop(0.4, `rgba(255, 255, 255, ${Math.min(0.8, r.life * 0.9)})`);
                    flashGrad.addColorStop(1, `rgba(255, 255, 255, 0)`);
                    ctx.fillStyle = flashGrad;
                    ctx.beginPath();
                    ctx.arc(r.x, r.y, r.flashRadius, 0, Math.PI * 2);
                    ctx.fill();
                }

                // B. Primary High-Lumen Shockwave Ring (Double Stroke: Wide Neon Glow + Pure White Core)
                // 1. Wide Neon Bloom Glow
                ctx.strokeStyle = r.palette.outer;
                ctx.lineWidth = 18 * r.life;
                ctx.shadowColor = r.palette.outer;
                ctx.shadowBlur = 35;
                ctx.beginPath();
                ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
                ctx.stroke();

                // 2. Pure White Core Line (100% Lamp Lumens)
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 5 * r.life;
                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
                ctx.stroke();

                // C. Secondary Concentric Echo Ring
                if (r.radius > 30) {
                    const secRadius = r.radius * 0.65;
                    ctx.strokeStyle = r.palette.secondary;
                    ctx.lineWidth = 10 * r.life;
                    ctx.shadowColor = r.palette.secondary;
                    ctx.shadowBlur = 20;
                    ctx.beginPath();
                    ctx.arc(r.x, r.y, secRadius, 0, Math.PI * 2);
                    ctx.stroke();

                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 3.5 * r.life;
                    ctx.shadowBlur = 0;
                    ctx.beginPath();
                    ctx.arc(r.x, r.y, secRadius, 0, Math.PI * 2);
                    ctx.stroke();
                }

                // D. Kinetic Flying Sparks & Streaks
                if (r.sparks) {
                    for (const sp of r.sparks) {
                        sp.x += sp.vx;
                        sp.y += sp.vy;
                        sp.vx *= 0.93;
                        sp.vy *= 0.93;
                        sp.life -= sp.decay;

                        if (sp.life > 0) {
                            ctx.strokeStyle = sp.color;
                            ctx.lineWidth = 4 * sp.life;
                            ctx.shadowColor = sp.color;
                            ctx.shadowBlur = 15;
                            ctx.beginPath();
                            ctx.moveTo(sp.x, sp.y);
                            ctx.lineTo(sp.x - sp.vx * 2.5, sp.y - sp.vy * 2.5);
                            ctx.stroke();

                            ctx.fillStyle = '#ffffff';
                            ctx.beginPath();
                            ctx.arc(sp.x, sp.y, 3 * sp.life, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    }
                }

                // E. High-Contrast Text Badge (Black Outline + Glowing White Text)
                ctx.font = 'bold 26px Segoe UI, Roboto, sans-serif';
                ctx.textAlign = 'center';
                const textY = r.y - r.radius - 20;

                ctx.strokeStyle = `rgba(0, 0, 0, ${r.life})`;
                ctx.lineWidth = 7;
                ctx.shadowBlur = 0;
                ctx.strokeText(r.label, r.x, textY);

                ctx.fillStyle = `rgba(255, 255, 255, ${r.life})`;
                ctx.shadowColor = r.palette.outer;
                ctx.shadowBlur = 20;
                ctx.fillText(r.label, r.x, textY);

                ctx.restore();
            }

            requestAnimationFrame(render);
        }
        requestAnimationFrame(render);

        // -------------------------------------------------------------
        // Tracker Lock Status (Only shown when [L] is pressed on tracker)
        // -------------------------------------------------------------
        function updateTrackerUI(data) {
            if (!data) return;
            if (data.locked) {
                trackerPill.style.display = "inline-block";
                trackerPill.innerHTML = `🔒 <b>Whiteboard: LOCKED</b> (Ready to Play)`;
                trackerPill.style.color = "#00ff88";
                trackerPill.style.borderColor = "#00ff88";
            } else {
                trackerPill.style.display = "none";
            }
        }

        // -------------------------------------------------------------
        // Real-Time Server-Sent Events (SSE) from Python Backend
        // -------------------------------------------------------------
        function connectToServer() {
            const sse = new EventSource('/events');

            sse.onopen = () => {
                connDot.classList.add('connected');
                connText.innerText = "Connected to Python Engine";
            };

            sse.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.event === 'HIT') {
                        triggerImpact(data.nx, data.ny, `HIT #${data.hit_num || totalHits + 1}`);
                    } else if (data.event === 'TRACKER_STATUS') {
                        updateTrackerUI(data);
                    }
                } catch (err) {
                    console.error("Error parsing event:", err);
                }
            };

            sse.onerror = () => {
                connDot.classList.remove('connected');
                connText.innerText = "Waiting for Python Engine...";
                sse.close();
                setTimeout(connectToServer, 2000);
            };
        }

        connectToServer();
    </script>
</body>
</html>
