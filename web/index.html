<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project THUD-WAVE: Arcade Bullseye</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        /* Top Navigation / Status Header */
        #hud {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            z-index: 10;
            color: #00ffcc;
            font-size: 14px;
            background: rgba(10, 10, 15, 0.88);
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid rgba(0, 255, 204, 0.35);
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(6px);
            transition: opacity 0.3s;
        }
        #hud.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .hud-left, .hud-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #ff3366;
            display: inline-block;
            box-shadow: 0 0 8px #ff3366;
        }
        .status-dot.connected {
            background-color: #00ff88;
            box-shadow: 0 0 8px #00ff88;
        }
        .badge {
            font-weight: 800;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 15px;
            letter-spacing: 0.5px;
        }
        .badge-score {
            background: rgba(255, 234, 0, 0.15);
            border: 1px solid #ffea00;
            color: #ffea00;
            box-shadow: 0 0 10px rgba(255, 234, 0, 0.3);
        }
        .badge-throws {
            background: rgba(0, 255, 204, 0.15);
            border: 1px solid #00ffcc;
            color: #00ffcc;
        }
        .btn {
            background: #111;
            color: #00ffcc;
            border: 1px solid #00ffcc;
            padding: 6px 14px;
            border-radius: 5px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn:hover {
            background: #00ffcc;
            color: #000;
            box-shadow: 0 0 12px #00ffcc;
        }
        .btn-gold {
            color: #ffea00;
            border-color: #ffea00;
        }
        .btn-gold:hover {
            background: #ffea00;
            color: #000;
            box-shadow: 0 0 12px #ffea00;
        }
        #tracker-pill {
            font-size: 12px;
            font-weight: bold;
            padding: 5px 12px;
            border-radius: 5px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #888;
            color: #aaa;
            transition: all 0.2s ease;
        }
        /* Instruction overlay for calibration */
        #calib-guide {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            color: #ffffff;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.88);
            padding: 10px 26px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            text-align: center;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        #calib-guide.hidden {
            opacity: 0;
        }
    </style>
</head>
<body>
    <div id="hud">
        <div class="hud-left">
            <div><span id="conn-dot" class="status-dot"></span> <span id="conn-text">Connecting...</span></div>
            <div id="badge-score" class="badge badge-score">Score: 0</div>
            <div id="badge-throws" class="badge badge-throws">Throws: 0 / 5</div>
            <button class="btn btn-gold" onclick="resetGameRound()">Reset Round [R]</button>
        </div>
        <div class="hud-right">
            <button class="btn" id="calib-btn" onclick="toggleCalibration()">Mode: Adjust Pins [C]</button>
            <button class="btn" onclick="triggerTestHit()">Test Throw [T]</button>
            <div id="tracker-pill" style="display: none;"></div>
            <div style="color: #888; font-size: 11px;">[F11] Fullscreen | [C] Pins | [R] Reset</div>
        </div>
    </div>

    <div id="calib-guide">
        📍 <b>Pin Calibration Mode</b>: Drag 4 pins to align with physical whiteboard edges. Press <b>[C]</b> for Arcade Game.
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const hud = document.getElementById('hud');
        const calibGuide = document.getElementById('calib-guide');
        const calibBtn = document.getElementById('calib-btn');
        const connDot = document.getElementById('conn-dot');
        const connText = document.getElementById('conn-text');
        const badgeScore = document.getElementById('badge-score');
        const badgeThrows = document.getElementById('badge-throws');
        const trackerPill = document.getElementById('tracker-pill');

        let isCalibrationMode = true; // Start in calibration mode
        let activeHandleIndex = -1;
        let hoveredHandleIndex = -1;
        let selectedHandleIndex = 0; // For arrow key nudging
        const HANDLE_RADIUS = 20;

        // 4 Calibration Corners in Normalized Screen Space (0.0 to 1.0)
        let corners = [
            { x: 0.15, y: 0.15 }, // TL
            { x: 0.85, y: 0.15 }, // TR
            { x: 0.85, y: 0.85 }, // BR
            { x: 0.15, y: 0.85 }  // BL
        ];

        let hasSavedCalibration = false;

        // 1. Immediately load saved calibration from localStorage
        const saved = localStorage.getItem('thudwave_corners');
        if (saved) {
            try {
                const parsed = JSON.parse(saved);
                if (Array.isArray(parsed) && parsed.length === 4) {
                    corners = parsed;
                    hasSavedCalibration = true;
                }
            } catch (e) {}
        }

        // 2. Fetch server-persisted calibration (projector_calibration.json)
        async function fetchServerCalibration() {
            try {
                const res = await fetch('/calibration');
                if (res.ok) {
                    const data = await res.json();
                    if (data && Array.isArray(data.corners) && data.corners.length === 4) {
                        corners = data.corners;
                        hasSavedCalibration = true;
                        localStorage.setItem('thudwave_corners', JSON.stringify(corners));
                        updateGuideText();
                    }
                }
            } catch (err) {}
        }
        fetchServerCalibration();

        function saveCalibration() {
            hasSavedCalibration = true;
            localStorage.setItem('thudwave_corners', JSON.stringify(corners));
            fetch('/calibration', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ corners: corners, timestamp: Date.now() })
            }).catch(() => {});
        }

        function updateGuideText() {
            if (isCalibrationMode) {
                if (hasSavedCalibration) {
                    calibGuide.innerHTML = `📍 <b>Previous Pins Restored</b>: Showing saved pin positions. Drag pins if projector moved, or press <b>[C]</b> for Arcade Game.`;
                } else {
                    calibGuide.innerHTML = `🎯 <b>Pin Calibration Mode</b>: Drag 4 pins to align with whiteboard edges. Press <b>[C]</b> for Arcade Game.`;
                }
            }
        }

        // -------------------------------------------------------------
        // Arcade Bullseye Target & Game Mechanics
        // -------------------------------------------------------------
        let targetPos = { nx: 0.5, ny: 0.5 }; // Position in normalized whiteboard space (0.0 - 1.0)
        let isDraggingTarget = false;
        const TARGET_MAX_RADIUS = 165; // Screen pixel radius of outer 10-point ring

        // Load saved target position if exists
        const savedTarget = localStorage.getItem('thudwave_target_pos');
        if (savedTarget) {
            try {
                const parsed = JSON.parse(savedTarget);
                if (parsed && typeof parsed.nx === 'number' && typeof parsed.ny === 'number') {
                    targetPos = parsed;
                }
            } catch (e) {}
        }

        const MAX_THROWS = 5;
        let currentThrows = 0;
        let totalScore = 0;
        let throwScores = [];
        let isGameOver = false;

        function updateHUD() {
            badgeScore.innerText = `Score: ${totalScore}`;
            badgeThrows.innerText = `Throws: ${currentThrows} / ${MAX_THROWS}`;
        }

        function resetGameRound() {
            currentThrows = 0;
            totalScore = 0;
            throwScores = [];
            isGameOver = false;
            confetti.length = 0;
            updateHUD();
            try {
                const metrics = getBoardMetrics();
                spawnScorePop(metrics.center.x, metrics.center.y - 30, "⚡ GAME RESET! ⚡", "#00ffcc");
                playChime(587.33, 'sine', 0.25);
            } catch (e) {}
        }

        // Floating score popup engine
        const scorePops = [];
        function spawnScorePop(x, y, text, color) {
            scorePops.push({
                x: x,
                y: y,
                text: text,
                color: color,
                life: 1.0,
                vy: -2.8
            });
        }

        // Confetti Celebration Engine
        const confetti = [];
        function spawnConfetti() {
            const colors = ['#00ffff', '#ff007f', '#ffea00', '#39ff14', '#ffffff', '#ff5500'];
            const metrics = getBoardMetrics();
            for (let i = 0; i < 180; i++) {
                confetti.push({
                    x: metrics.center.x + (Math.random() - 0.5) * Math.min(320, metrics.width * 0.7),
                    y: metrics.center.y - 60 + (Math.random() - 0.5) * 120,
                    vx: (Math.random() - 0.5) * 22,
                    vy: -12 - Math.random() * 14,
                    size: 8 + Math.random() * 10,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    tilt: Math.random() * 10,
                    tiltAngle: Math.random() * Math.PI * 2,
                    tiltSpeed: 0.08 + Math.random() * 0.1,
                    life: 1.0,
                    gravity: 0.42 + Math.random() * 0.2
                });
            }
        }

        // -------------------------------------------------------------
        // Web Audio API Synthesizer (Instant 0ms Audio)
        // -------------------------------------------------------------
        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function playBoomSound() {
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(160, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, ctx.currentTime + 0.35);

                gain.gain.setValueAtTime(1.0, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start();
                osc.stop(ctx.currentTime + 0.36);
            } catch (e) {}
        }

        function playChime(freq, type = 'sine', duration = 0.25) {
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                gain.gain.setValueAtTime(0.7, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + duration);
            } catch (e) {}
        }

        function playHitSound(points) {
            playBoomSound();
            if (points === 100) {
                setTimeout(() => playChime(523.25, 'triangle', 0.35), 40);  // C5
                setTimeout(() => playChime(659.25, 'triangle', 0.35), 140); // E5
                setTimeout(() => playChime(783.99, 'triangle', 0.45), 240); // G5
                setTimeout(() => playChime(1046.50, 'triangle', 0.8), 340); // C6
            } else if (points >= 50) {
                setTimeout(() => playChime(587.33, 'sine', 0.25), 60);
                setTimeout(() => playChime(880.00, 'sine', 0.35), 160);
            } else if (points >= 10) {
                setTimeout(() => playChime(440.00, 'sine', 0.25), 60);
            } else {
                setTimeout(() => playChime(130.81, 'sawtooth', 0.25), 60);
            }
        }

        function playVictorySound() {
            setTimeout(() => playChime(523.25, 'triangle', 0.3), 0);
            setTimeout(() => playChime(659.25, 'triangle', 0.3), 150);
            setTimeout(() => playChime(783.99, 'triangle', 0.3), 300);
            setTimeout(() => playChime(1046.50, 'triangle', 0.8), 450);
        }

        // -------------------------------------------------------------
        // Coordinate Transformation
        // -------------------------------------------------------------
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        function mapWhiteboardToScreen(nx, ny) {
            const W = canvas.width;
            const H = canvas.height;
            const p0 = { x: corners[0].x * W, y: corners[0].y * H }; // TL
            const p1 = { x: corners[1].x * W, y: corners[1].y * H }; // TR
            const p2 = { x: corners[2].x * W, y: corners[2].y * H }; // BR
            const p3 = { x: corners[3].x * W, y: corners[3].y * H }; // BL

            const topX = p0.x + (p1.x - p0.x) * nx;
            const topY = p0.y + (p1.y - p0.y) * nx;

            const botX = p3.x + (p2.x - p3.x) * nx;
            const botY = p3.y + (p2.y - p3.y) * nx;

            return {
                x: topX + (botX - topX) * ny,
                y: topY + (botY - topY) * ny
            };
        }

        function mapScreenToWhiteboard(px, py) {
            const W = canvas.width;
            const H = canvas.height;
            const minX = Math.min(...corners.map(c => c.x * W));
            const maxX = Math.max(...corners.map(c => c.x * W));
            const minY = Math.min(...corners.map(c => c.y * H));
            const maxY = Math.max(...corners.map(c => c.y * H));
            const nx = Math.max(0, Math.min(1, (px - minX) / (maxX - minX)));
            const ny = Math.max(0, Math.min(1, (py - minY) / (maxY - minY)));
            return { nx, ny };
        }

        // Calculates bounding box and maximum fitting bullseye circle for whiteboard
        function getBoardMetrics() {
            const W = canvas.width;
            const H = canvas.height;
            const p0 = { x: corners[0].x * W, y: corners[0].y * H }; // TL
            const p1 = { x: corners[1].x * W, y: corners[1].y * H }; // TR
            const p2 = { x: corners[2].x * W, y: corners[2].y * H }; // BR
            const p3 = { x: corners[3].x * W, y: corners[3].y * H }; // BL

            const minX = Math.min(p0.x, p1.x, p2.x, p3.x);
            const maxX = Math.max(p0.x, p1.x, p2.x, p3.x);
            const minY = Math.min(p0.y, p1.y, p2.y, p3.y);
            const maxY = Math.max(p0.y, p1.y, p2.y, p3.y);

            const width = maxX - minX;
            const height = maxY - minY;
            const center = mapWhiteboardToScreen(0.5, 0.5);

            // Maximum radius to fit circles snugly inside the whiteboard bounding rectangle
            const maxRadius = Math.max(70, (Math.min(width, height) / 2) * 0.94);

            return {
                minX, maxX, minY, maxY,
                width, height,
                center,
                maxRadius,
                r10: maxRadius,
                r25: maxRadius * 0.72,
                r50: maxRadius * 0.44,
                r100: Math.max(18, maxRadius * 0.18)
            };
        }

        // Active shockwave ripple animations
        const ripples = [];

        // -------------------------------------------------------------
        // Hit Impact Evaluation (Bullseye Target Logic)
        // -------------------------------------------------------------
        function evaluateHit(screenPt) {
            if (isGameOver) {
                resetGameRound();
                return;
            }

            const metrics = getBoardMetrics();
            const targetCenter = mapWhiteboardToScreen(targetPos.nx, targetPos.ny);
            const dist = Math.hypot(screenPt.x - targetCenter.x, screenPt.y - targetCenter.y);

            let points = 0;
            let label = "MISS";
            let color = "#888888";
            let palette = { outer: '#888888', secondary: '#444444' };

            if (dist <= metrics.r100) {
                points = 100;
                label = "🎯 BULLSEYE! +100";
                color = "#ffea00";
                palette = { outer: '#ffea00', secondary: '#ffffff' };
            } else if (dist <= metrics.r50) {
                points = 50;
                label = "INNER RING +50";
                color = "#ff007f";
                palette = { outer: '#ff007f', secondary: '#00ffff' };
            } else if (dist <= metrics.r25) {
                points = 25;
                label = "MID RING +25";
                color = "#00ffcc";
                palette = { outer: '#00ffcc', secondary: '#39ff14' };
            } else if (dist <= metrics.r10) {
                points = 10;
                label = "OUTER RING +10";
                color = "#0088ff";
                palette = { outer: '#0088ff', secondary: '#00ffff' };
            } else {
                points = 0;
                label = "MISS! 0 PTS";
                color = "#ff3366";
                palette = { outer: '#ff3366', secondary: '#888888' };
            }

            currentThrows++;
            totalScore += points;
            throwScores.push(points);

            spawnScorePop(screenPt.x, screenPt.y - 35, label, color);
            playHitSound(points);
            updateHUD();

            // Spawn Kinetic Shockwave
            const sparks = [];
            const sparkCount = (points === 100) ? 30 : 18;
            for (let i = 0; i < sparkCount; i++) {
                const angle = (Math.PI * 2 / sparkCount) * i + (Math.random() - 0.5) * 0.4;
                const speed = 6.0 + Math.random() * 9.0;
                sparks.push({
                    x: screenPt.x,
                    y: screenPt.y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1.0,
                    decay: 0.022 + Math.random() * 0.015,
                    color: palette.secondary
                });
            }

            ripples.push({
                x: screenPt.x,
                y: screenPt.y,
                radius: 12,
                palette: palette,
                label: label,
                life: 1.0,
                flashRadius: 15,
                sparks: sparks
            });

            if (currentThrows >= MAX_THROWS) {
                isGameOver = true;
                spawnConfetti();
                playVictorySound();
            }
        }

        function triggerImpact(nx, ny) {
            const screenPt = mapWhiteboardToScreen(nx, ny);
            evaluateHit(screenPt);
        }

        function triggerTestHit() {
            // Random point near or inside the bullseye
            const metrics = getBoardMetrics();
            const targetCenter = mapWhiteboardToScreen(targetPos.nx, targetPos.ny);
            const angle = Math.random() * Math.PI * 2;
            const dist = Math.random() * (metrics.r10 * 1.15);
            const px = targetCenter.x + Math.cos(angle) * dist;
            const py = targetCenter.y + Math.sin(angle) * dist;
            const norm = mapScreenToWhiteboard(px, py);
            triggerImpact(norm.nx, norm.ny);
        }

        // -------------------------------------------------------------
        // Mouse & Keyboard Controls
        // -------------------------------------------------------------
        canvas.addEventListener('mousedown', (e) => {
            getAudioContext();
            const mouseX = e.clientX;
            const mouseY = e.clientY;
            const W = canvas.width;
            const H = canvas.height;

            if (isCalibrationMode) {
                for (let i = 0; i < 4; i++) {
                    const cx = corners[i].x * W;
                    const cy = corners[i].y * H;
                    const dist = Math.hypot(mouseX - cx, mouseY - cy);
                    if (dist <= HANDLE_RADIUS + 14) {
                        activeHandleIndex = i;
                        selectedHandleIndex = i;
                        canvas.style.cursor = 'grabbing';
                        return;
                    }
                }
                return;
            }

            if (isGameOver) {
                resetGameRound();
                return;
            }

            // In Game Mode: check if user is clicking to drag the bullseye target
            const metrics = getBoardMetrics();
            const targetScreen = mapWhiteboardToScreen(targetPos.nx, targetPos.ny);
            const distToTarget = Math.hypot(mouseX - targetScreen.x, mouseY - targetScreen.y);
            if (distToTarget <= metrics.r10) {
                isDraggingTarget = true;
                canvas.style.cursor = 'grabbing';
                return;
            }

            // Otherwise, click simulates an impact
            const norm = mapScreenToWhiteboard(mouseX, mouseY);
            triggerImpact(norm.nx, norm.ny);
        });

        window.addEventListener('mousemove', (e) => {
            const W = canvas.width;
            const H = canvas.height;

            if (isCalibrationMode) {
                if (activeHandleIndex !== -1) {
                    corners[activeHandleIndex].x = Math.max(0.01, Math.min(0.99, e.clientX / W));
                    corners[activeHandleIndex].y = Math.max(0.01, Math.min(0.99, e.clientY / H));
                    saveCalibration();
                    canvas.style.cursor = 'grabbing';
                } else {
                    let hovering = -1;
                    for (let i = 0; i < 4; i++) {
                        const cx = corners[i].x * W;
                        const cy = corners[i].y * H;
                        if (Math.hypot(e.clientX - cx, e.clientY - cy) <= HANDLE_RADIUS + 14) {
                            hovering = i;
                            break;
                        }
                    }
                    hoveredHandleIndex = hovering;
                    canvas.style.cursor = (hovering !== -1) ? 'grab' : 'default';
                }
            } else if (isDraggingTarget) {
                const norm = mapScreenToWhiteboard(e.clientX, e.clientY);
                targetPos.nx = Math.max(0.1, Math.min(0.9, norm.nx));
                targetPos.ny = Math.max(0.1, Math.min(0.9, norm.ny));
                localStorage.setItem('thudwave_target_pos', JSON.stringify(targetPos));
                canvas.style.cursor = 'grabbing';
            } else {
                const metrics = getBoardMetrics();
                const targetScreen = mapWhiteboardToScreen(targetPos.nx, targetPos.ny);
                const distToTarget = Math.hypot(e.clientX - targetScreen.x, e.clientY - targetScreen.y);
                canvas.style.cursor = (distToTarget <= metrics.r10) ? 'grab' : 'default';
            }
        });

        window.addEventListener('mouseup', () => {
            if (activeHandleIndex !== -1) {
                saveCalibration();
            }
            activeHandleIndex = -1;
            isDraggingTarget = false;
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'c' || e.key === 'C') {
                toggleCalibration();
            } else if (e.key === 'r' || e.key === 'R') {
                resetGameRound();
            } else if (e.key === 't' || e.key === 'T') {
                triggerTestHit();
            } else if (e.key === 'h' || e.key === 'H') {
                hud.classList.toggle('hidden');
            } else if (isCalibrationMode && ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                e.preventDefault();
                const step = e.shiftKey ? 0.01 : 0.002;
                const pin = corners[selectedHandleIndex];
                if (e.key === 'ArrowUp') pin.y = Math.max(0.01, pin.y - step);
                if (e.key === 'ArrowDown') pin.y = Math.min(0.99, pin.y + step);
                if (e.key === 'ArrowLeft') pin.x = Math.max(0.01, pin.x - step);
                if (e.key === 'ArrowRight') pin.x = Math.min(0.99, pin.x + step);
                saveCalibration();
            } else if (isCalibrationMode && ['1', '2', '3', '4'].includes(e.key)) {
                selectedHandleIndex = parseInt(e.key) - 1;
            }
        });

        function toggleCalibration() {
            isCalibrationMode = !isCalibrationMode;
            if (isCalibrationMode) {
                calibBtn.innerText = "Mode: Adjust Pins [C]";
                calibBtn.style.borderColor = "#00ffcc";
                calibBtn.style.color = "#00ffcc";
                calibGuide.classList.remove('hidden');
                updateGuideText();
            } else {
                saveCalibration();
                calibBtn.innerText = "Mode: Arcade Game [C]";
                calibBtn.style.borderColor = "#ffea00";
                calibBtn.style.color = "#ffea00";
                calibGuide.classList.add('hidden');
            }
        }

        // -------------------------------------------------------------
        // Main Animation Loop (60 FPS Canvas Render)
        // -------------------------------------------------------------
        function render() {
            const W = canvas.width;
            const H = canvas.height;

            // 1. Pure Black Background (invisible on wall)
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, W, H);

            // 2. Draw Calibration Quad & Pins (Only in Calibration Mode)
            if (isCalibrationMode) {
                const pts = corners.map(c => ({ x: c.x * W, y: c.y * H }));

                // Glowing Quad Border
                ctx.save();
                ctx.strokeStyle = '#00ffcc';
                ctx.lineWidth = 2;
                ctx.shadowColor = '#00ffcc';
                ctx.shadowBlur = 12;
                ctx.beginPath();
                ctx.moveTo(pts[0].x, pts[0].y);
                ctx.lineTo(pts[1].x, pts[1].y);
                ctx.lineTo(pts[2].x, pts[2].y);
                ctx.lineTo(pts[3].x, pts[3].y);
                ctx.closePath();
                ctx.stroke();

                // Crosshair in Center
                const center = mapWhiteboardToScreen(0.5, 0.5);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(center.x - 20, center.y);
                ctx.lineTo(center.x + 20, center.y);
                ctx.moveTo(center.x, center.y - 20);
                ctx.lineTo(center.x, center.y + 20);
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(center.x, center.y, 10, 0, Math.PI * 2);
                ctx.stroke();

                // 4 Corner Draggable Pins
                for (let i = 0; i < 4; i++) {
                    const isSelected = (selectedHandleIndex === i);
                    const isActive = (activeHandleIndex === i);
                    const isHovered = (hoveredHandleIndex === i);

                    ctx.beginPath();
                    ctx.arc(pts[i].x, pts[i].y, HANDLE_RADIUS + (isActive ? 6 : isHovered ? 3 : 0), 0, Math.PI * 2);
                    ctx.strokeStyle = isActive ? '#ffffff' : (isSelected ? '#ffea00' : '#00ffcc');
                    ctx.lineWidth = isActive ? 3 : 2;
                    ctx.shadowColor = isActive ? '#ffffff' : (isSelected ? '#ffea00' : '#00ffcc');
                    ctx.shadowBlur = isActive ? 20 : 12;
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(pts[i].x, pts[i].y, HANDLE_RADIUS, 0, Math.PI * 2);
                    ctx.fillStyle = isActive ? '#ffffff' : (isHovered ? '#33ffdd' : '#00ccaa');
                    ctx.fill();

                    ctx.beginPath();
                    ctx.arc(pts[i].x, pts[i].y, 6, 0, Math.PI * 2);
                    ctx.fillStyle = '#000000';
                    ctx.fill();
                }
                ctx.restore();
            } else {
                // -------------------------------------------------------------
                // 3. Render Arcade Bullseye Target (Game Mode)
                // -------------------------------------------------------------
                const metrics = getBoardMetrics();
                const targetCenter = mapWhiteboardToScreen(targetPos.nx, targetPos.ny);
                const tx = targetCenter.x;
                const ty = targetCenter.y;
                const { r10, r25, r50, r100 } = metrics;

                ctx.save();

                // Outer 10 PTS Ring
                ctx.beginPath();
                ctx.arc(tx, ty, r10, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0, 136, 255, 0.12)';
                ctx.fill();
                ctx.strokeStyle = '#0088ff';
                ctx.lineWidth = Math.max(3, r10 * 0.024);
                ctx.shadowColor = '#0088ff';
                ctx.shadowBlur = 16;
                ctx.stroke();

                // Mid 25 PTS Ring
                ctx.beginPath();
                ctx.arc(tx, ty, r25, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0, 255, 204, 0.16)';
                ctx.fill();
                ctx.strokeStyle = '#00ffcc';
                ctx.lineWidth = Math.max(3, r10 * 0.024);
                ctx.shadowColor = '#00ffcc';
                ctx.shadowBlur = 18;
                ctx.stroke();

                // Inner 50 PTS Ring
                ctx.beginPath();
                ctx.arc(tx, ty, r50, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 0, 127, 0.22)';
                ctx.fill();
                ctx.strokeStyle = '#ff007f';
                ctx.lineWidth = Math.max(4, r10 * 0.03);
                ctx.shadowColor = '#ff007f';
                ctx.shadowBlur = 22;
                ctx.stroke();

                // 100 PTS Bullseye Center
                ctx.beginPath();
                ctx.arc(tx, ty, r100, 0, Math.PI * 2);
                ctx.fillStyle = '#ffea00';
                ctx.shadowColor = '#ffea00';
                ctx.shadowBlur = 30;
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = Math.max(3, r10 * 0.025);
                ctx.stroke();

                // Target Crosshairs
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
                ctx.lineWidth = 2;
                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.moveTo(tx - r10 - 12, ty);
                ctx.lineTo(tx + r10 + 12, ty);
                ctx.moveTo(tx, ty - r10 - 12);
                ctx.lineTo(tx, ty + r10 + 12);
                ctx.stroke();

                // Point Labels on Target Rings
                const numFontSize = Math.max(12, Math.round(r10 * 0.085));
                ctx.font = `bold ${numFontSize}px Segoe UI, sans-serif`;
                ctx.fillStyle = '#ffffff';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = '#000000';
                ctx.shadowBlur = 4;

                const pos10 = (r10 + r25) / 2;
                const pos25 = (r25 + r50) / 2;
                const pos50 = (r50 + r100) / 2;

                ctx.fillText('10', tx, ty - pos10);
                ctx.fillText('10', tx, ty + pos10);
                ctx.fillText('25', tx, ty - pos25);
                ctx.fillText('25', tx, ty + pos25);
                ctx.fillText('50', tx, ty - pos50);
                ctx.fillText('50', tx, ty + pos50);

                // Center Bullseye Label
                const bullFontSize = Math.max(13, Math.round(r100 * 0.48));
                ctx.font = `bold ${bullFontSize}px Segoe UI, sans-serif`;
                ctx.fillStyle = '#000000';
                ctx.fillText('100', tx, ty);

                // Subtle drag instruction below target
                ctx.font = `${Math.max(11, Math.round(r10 * 0.065))}px Segoe UI, sans-serif`;
                ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
                ctx.fillText('✥ Drag target to reposition', tx, ty + r10 + 18);

                ctx.restore();
            }

            // -------------------------------------------------------------
            // 4. Render Active Kinetic Shockwaves
            // -------------------------------------------------------------
            for (let i = ripples.length - 1; i >= 0; i--) {
                const r = ripples[i];
                r.radius += 5.8;
                r.life -= 0.016;

                if (r.life <= 0) {
                    ripples.splice(i, 1);
                    continue;
                }

                ctx.save();

                // Center Flash Disc
                if (r.flashRadius < 90) {
                    r.flashRadius += 5.0;
                    const flashGrad = ctx.createRadialGradient(r.x, r.y, 0, r.x, r.y, r.flashRadius);
                    flashGrad.addColorStop(0, `rgba(255, 255, 255, ${Math.min(1.0, r.life * 1.3)})`);
                    flashGrad.addColorStop(0.4, `rgba(255, 255, 255, ${Math.min(0.8, r.life * 0.9)})`);
                    flashGrad.addColorStop(1, `rgba(255, 255, 255, 0)`);
                    ctx.fillStyle = flashGrad;
                    ctx.beginPath();
                    ctx.arc(r.x, r.y, r.flashRadius, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Primary Neon Ring
                ctx.strokeStyle = r.palette.outer;
                ctx.lineWidth = 18 * r.life;
                ctx.shadowColor = r.palette.outer;
                ctx.shadowBlur = 35;
                ctx.beginPath();
                ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
                ctx.stroke();

                // Pure White Core
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 5 * r.life;
                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
                ctx.stroke();

                // Sparks
                if (r.sparks) {
                    for (const sp of r.sparks) {
                        sp.x += sp.vx;
                        sp.y += sp.vy;
                        sp.vx *= 0.93;
                        sp.vy *= 0.93;
                        sp.life -= sp.decay;

                        if (sp.life > 0) {
                            ctx.strokeStyle = sp.color;
                            ctx.lineWidth = 4 * sp.life;
                            ctx.shadowColor = sp.color;
                            ctx.shadowBlur = 15;
                            ctx.beginPath();
                            ctx.moveTo(sp.x, sp.y);
                            ctx.lineTo(sp.x - sp.vx * 2.5, sp.y - sp.vy * 2.5);
                            ctx.stroke();

                            ctx.fillStyle = '#ffffff';
                            ctx.beginPath();
                            ctx.arc(sp.x, sp.y, 3 * sp.life, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    }
                }

                ctx.restore();
            }

            // -------------------------------------------------------------
            // 5. Floating Score Popups
            // -------------------------------------------------------------
            for (let i = scorePops.length - 1; i >= 0; i--) {
                const sp = scorePops[i];
                sp.y += sp.vy;
                sp.life -= 0.018;

                if (sp.life <= 0) {
                    scorePops.splice(i, 1);
                    continue;
                }

                ctx.save();
                ctx.font = 'bold 30px Segoe UI, sans-serif';
                ctx.textAlign = 'center';

                // Black outline
                ctx.strokeStyle = `rgba(0, 0, 0, ${sp.life})`;
                ctx.lineWidth = 8;
                ctx.strokeText(sp.text, sp.x, sp.y);

                // Glowing text
                ctx.fillStyle = sp.color;
                ctx.shadowColor = sp.color;
                ctx.shadowBlur = 20;
                ctx.fillText(sp.text, sp.x, sp.y);
                ctx.restore();
            }

            // -------------------------------------------------------------
            // 6. Confetti Celebration
            // -------------------------------------------------------------
            for (let i = confetti.length - 1; i >= 0; i--) {
                const c = confetti[i];
                c.x += c.vx;
                c.y += c.vy;
                c.vy += c.gravity;
                c.vx *= 0.98;
                c.tiltAngle += c.tiltSpeed;
                c.tilt = Math.sin(c.tiltAngle) * 12;

                ctx.save();
                ctx.fillStyle = c.color;
                ctx.beginPath();
                ctx.ellipse(c.x, c.y, c.size / 2, Math.abs(c.tilt) / 2 + 2, c.tiltAngle, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                if (c.y > H + 50) {
                    confetti.splice(i, 1);
                }
            }

            // -------------------------------------------------------------
            // 7. Game Over Celebration Banner (Strictly fitted inside whiteboard bounds)
            // -------------------------------------------------------------
            if (isGameOver) {
                ctx.save();
                const metrics = getBoardMetrics();

                // Scale card to fit strictly inside the calibrated whiteboard bounding box
                const cardW = Math.max(260, Math.min(metrics.width * 0.88, 500));
                const cardH = Math.max(160, Math.min(metrics.height * 0.68, 250));
                const cardX = metrics.center.x - cardW / 2;
                const cardY = metrics.center.y - cardH / 2;

                // Glowing Backdrop Card
                ctx.fillStyle = 'rgba(10, 15, 25, 0.95)';
                ctx.strokeStyle = '#ffea00';
                ctx.lineWidth = Math.max(2, Math.min(4, cardH * 0.015));
                ctx.shadowColor = '#ffea00';
                ctx.shadowBlur = 30;
                ctx.beginPath();
                ctx.roundRect(cardX, cardY, cardW, cardH, Math.min(20, cardH * 0.08));
                ctx.fill();
                ctx.stroke();

                // Dynamic proportional font scaling
                const titleSize = Math.max(16, Math.round(cardH * 0.15));
                const scoreSize = Math.max(22, Math.round(cardH * 0.20));
                const ratingSize = Math.max(12, Math.round(cardH * 0.10));
                const promptSize = Math.max(11, Math.round(cardH * 0.085));

                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                // Title
                ctx.font = `bold ${titleSize}px Segoe UI, sans-serif`;
                ctx.fillStyle = '#ffea00';
                ctx.shadowColor = '#ffea00';
                ctx.shadowBlur = 16;
                ctx.fillText('🏆 ROUND COMPLETE!', metrics.center.x, cardY + cardH * 0.22);

                // Final Score
                ctx.font = `bold ${scoreSize}px Segoe UI, sans-serif`;
                ctx.fillStyle = '#ffffff';
                ctx.shadowBlur = 10;
                ctx.fillText(`${totalScore} / 500 PTS`, metrics.center.x, cardY + cardH * 0.48);

                // Rating Badge
                let rating = "ROOKIE GUNNER 🎯";
                if (totalScore >= 400) rating = "🥇 LEGENDARY SHARPSHOOTER!";
                else if (totalScore >= 250) rating = "🥈 EXCELLENT MARKSMAN!";
                else if (totalScore >= 100) rating = "🥉 GOOD SHOT!";

                ctx.font = `bold ${ratingSize}px Segoe UI, sans-serif`;
                ctx.fillStyle = '#00ffcc';
                ctx.shadowColor = '#00ffcc';
                ctx.shadowBlur = 10;
                ctx.fillText(rating, metrics.center.x, cardY + cardH * 0.70);

                // Restart Prompt Button
                ctx.font = `bold ${promptSize}px Segoe UI, sans-serif`;
                ctx.fillStyle = '#ffea00';
                ctx.shadowColor = '#ffea00';
                ctx.shadowBlur = 8;
                ctx.fillText('⚡ Click, Press [R], or Tracker [R] to Play Again ⚡', metrics.center.x, cardY + cardH * 0.88);

                ctx.restore();
            }

            requestAnimationFrame(render);
        }
        requestAnimationFrame(render);

        // -------------------------------------------------------------
        // Tracker Lock Status
        // -------------------------------------------------------------
        function updateTrackerUI(data) {
            if (!data) return;
            if (data.locked) {
                trackerPill.style.display = "inline-block";
                trackerPill.innerHTML = `🔒 <b>Whiteboard: LOCKED</b> (Ready to Play)`;
                trackerPill.style.color = "#00ff88";
                trackerPill.style.borderColor = "#00ff88";
            } else {
                trackerPill.style.display = "none";
            }
        }

        // -------------------------------------------------------------
        // Real-Time Server-Sent Events (SSE) from Python Backend
        // -------------------------------------------------------------
        function connectToServer() {
            const sse = new EventSource('/events');

            sse.onopen = () => {
                connDot.classList.add('connected');
                connText.innerText = "Python Connected";
            };

            sse.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.event === 'HIT') {
                        triggerImpact(data.nx, data.ny);
                    } else if (data.event === 'TRACKER_STATUS') {
                        updateTrackerUI(data);
                        // When server sends locked = true, automatically enter Arcade Game Mode!
                        if (data.locked && isCalibrationMode) {
                            toggleCalibration();
                        }
                    } else if (data.event === 'RESET') {
                        resetGameRound();
                    }
                } catch (err) {
                    console.error("Error parsing event:", err);
                }
            };

            sse.onerror = () => {
                connDot.classList.remove('connected');
                connText.innerText = "Connecting...";
                sse.close();
                setTimeout(connectToServer, 2000);
            };
        }

        connectToServer();
    </script>
